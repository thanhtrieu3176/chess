appId: local.thanhtrieu.chessanalyzer
productName: Chess Analyzer
directories:
  output: dist
files:
  - out/**
  - package.json
win:
  target: nsis
nsis:
  oneClick: true
  perMachine: false
# Chỉ giữ ngôn ngữ giao diện Chromium cần dùng (bỏ ~40MB file ngôn ngữ khác).
electronLanguages:
  - vi
  - en-US
compression: maximum
